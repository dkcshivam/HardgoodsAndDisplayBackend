# On a server where Traefik already owns ports 80 and 443 (the EC2 host).
# Traefik routes API_ADDRESS to the API — the admin, over https; the app
# itself reaches the API through the frontend and never needs this. The
# TRAEFIK_ values are read off the running Traefik; DEPLOY.md shows how.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.traefik.yml up -d --build

services:
  backend:
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK in .env}
      traefik.http.routers.dkc-packing-api.rule: "Host(`${API_ADDRESS:?Set API_ADDRESS in .env}`)"
      traefik.http.routers.dkc-packing-api.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.dkc-packing-api.tls: "true"
      traefik.http.routers.dkc-packing-api.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.services.dkc-packing-api.loadbalancer.server.port: "8000"
      traefik.http.routers.dkc-packing-api-http.rule: "Host(`${API_ADDRESS}`)"
      traefik.http.routers.dkc-packing-api-http.entrypoints: ${TRAEFIK_HTTP_ENTRYPOINT:-web}
      traefik.http.routers.dkc-packing-api-http.middlewares: dkc-packing-api-https
      traefik.http.middlewares.dkc-packing-api-https.redirectscheme.scheme: https
    # default is spelled out: listing any network replaces the implicit one,
    # and the API still needs it to reach the database.
    networks:
      - default
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
